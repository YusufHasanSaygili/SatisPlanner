[package]
name = "satisplanner-rewrite-probe"
version = "0.0.0"
description = "SatisPlanner Slice 00 read-only filesystem probe"
edition = "2024"

[lib]
name = "satisplanner_rewrite_probe"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
