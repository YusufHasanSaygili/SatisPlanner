name: SatisPlanner Quality

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm quality
      - name: Record calculation coverage gate
        run: pnpm test:coverage
      - name: Record graph performance baseline
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          pnpm test:performance | tee artifacts/performance-baseline.txt
      - run: pnpm test:e2e

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: SatisPlanner-test-failure-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage and performance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SatisPlanner-hardening-evidence
          path: |
            coverage/calculation
            artifacts/performance-baseline.txt
            artifacts/calculation-performance.json
            artifacts/graph-performance.json
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v6
        with:
          name: SatisPlanner-web
          path: apps/desktop-ui/dist
          retention-days: 7

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build

      - name: Build current-user Windows installer
        if: runner.os == 'Windows'
        run: pnpm desktop:bundle:windows

      - name: Smoke packaged binary version
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./src-tauri/target/release/satisplanner.exe --version
          else
            ./src-tauri/target/release/satisplanner --version
          fi

      - name: Clean-machine install, launch, save, reopen and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          ./scripts/windows-clean-machine-smoke.ps1 -InstallerPath $installer.FullName |
            Tee-Object -FilePath windows-clean-machine-smoke.json

      - name: Stage branded portable and installer artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp src-tauri/target/release/satisplanner.exe release-artifacts/SatisPlanner.exe
            cp src-tauri/target/release/bundle/nsis/*-setup.exe release-artifacts/SatisPlanner-setup.exe
            cp windows-clean-machine-smoke.json release-artifacts/
          else
            cp src-tauri/target/release/satisplanner release-artifacts/SatisPlanner
          fi
          cp LICENSE THIRD-PARTY-NOTICES.md release-artifacts/
          find release-artifacts -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || ls -1 release-artifacts
          if find release-artifacts -type f | grep -Eiq '\.(pak|utoc|ucas|uasset|uexp|sav)$'; then
            echo 'Forbidden game asset found in packaged artifact.' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: SatisPlanner-${{ runner.os }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 7
