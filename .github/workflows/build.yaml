name: SatisPlanner Quality

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm quality
      - name: Record calculation coverage gate
        run: pnpm test:coverage
      - name: Record graph performance baseline
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          pnpm test:performance | tee artifacts/performance-baseline.txt
      - run: pnpm test:e2e

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: SatisPlanner-test-failure-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage and performance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SatisPlanner-hardening-evidence
          path: |
            coverage/calculation
            artifacts/performance-baseline.txt
            artifacts/calculation-performance.json
            artifacts/graph-performance.json
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v6
        with:
          name: SatisPlanner-web
          path: apps/desktop-ui/dist
          retention-days: 7

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build

      - name: Smoke packaged binary version
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./src-tauri/target/release/satisplanner.exe --version
          else
            ./src-tauri/target/release/satisplanner --version
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: SatisPlanner-${{ runner.os }}
          path: |
            src-tauri/target/release/satisplanner
            src-tauri/target/release/satisplanner.exe
          if-no-files-found: error
          retention-days: 7
