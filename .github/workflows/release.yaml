name: SatisPlanner Verified Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated SemVer tag"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify annotated tag, pushed SHA and package version
        id: metadata
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG}"
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git cat-file -e "${TAG}^{tag}"
          TAG_SHA="$(git rev-list -n 1 "${TAG}")"
          test "${TAG_SHA}" = "${GITHUB_SHA}"
          VERSION="${TAG#v}"
          test "$(node -p "require('./package.json').version")" = "${VERSION}"
          grep -Fq "version = \"${VERSION}\"" src-tauri/Cargo.toml
          node scripts/check-packaging.mjs
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "sha=${TAG_SHA}" >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@v8
        with:
          name: SatisPlanner-Windows
          path: artifacts/windows

      - uses: actions/download-artifact@v8
        with:
          name: SatisPlanner-Linux
          path: artifacts/linux

      - uses: actions/download-artifact@v8
        with:
          name: SatisPlanner-macOS
          path: artifacts/macos

      - uses: actions/download-artifact@v8
        with:
          name: SatisPlanner-web
          path: artifacts/web

      - name: Prepare release staging
        run: mkdir -p dist

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/SatisPlanner-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Package branded release artifacts and checksums
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifacts/linux/SatisPlanner artifacts/macos/SatisPlanner
          cp artifacts/windows/SatisPlanner-setup.exe "dist/SatisPlanner-windows-x64-v${VERSION}-setup.exe"
          zip -j "dist/SatisPlanner-windows-x64-portable-v${VERSION}.zip" \
            artifacts/windows/SatisPlanner.exe LICENSE THIRD-PARTY-NOTICES.md
          zip -j "dist/SatisPlanner-linux-x64-portable-v${VERSION}.zip" \
            artifacts/linux/SatisPlanner LICENSE THIRD-PARTY-NOTICES.md
          zip -j "dist/SatisPlanner-macos-portable-v${VERSION}.zip" \
            artifacts/macos/SatisPlanner LICENSE THIRD-PARTY-NOTICES.md
          (cd artifacts/web && zip -r "../../dist/SatisPlanner-web-v${VERSION}.zip" .)
          zip -r "dist/SatisPlanner-examples-v${VERSION}.zip" examples
          zip -r "dist/SatisPlanner-documentation-v${VERSION}.zip" \
            docs/user-guide docs/release-candidate
          cp THIRD-PARTY-NOTICES.md dist/
          cp CHANGELOG.md dist/
          if find dist -type f | grep -Eiq '\.(pak|utoc|ucas|uasset|uexp|sav)$'; then
            echo 'Forbidden game asset found in release staging.' >&2
            exit 1
          fi
          (cd dist && sha256sum SatisPlanner-* THIRD-PARTY-NOTICES.md CHANGELOG.md > SHA256SUMS.txt)
          (cd dist && sha256sum --check SHA256SUMS.txt)

      - name: Attest release build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS.txt
          sbom-path: dist/SatisPlanner-sbom.spdx.json

      - name: Publish verified unsigned stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SHA: ${{ steps.metadata.outputs.sha }}
        shell: bash
        run: |
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --latest \
            --title "SatisPlanner v${VERSION}" \
            --notes-file docs/release-candidate/RELEASE-NOTES-v1.0.0.md

      - name: Verify Latest release and every checksum asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = "${TAG}"
          test "$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq .isPrerelease)" = "false"
          mkdir verify-download
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir verify-download
          cp verify-download/SHA256SUMS.txt verify-download/SHA256SUMS.verify.txt
          (cd verify-download && sha256sum --check SHA256SUMS.verify.txt)

      - uses: actions/upload-artifact@v6
        with:
          name: SatisPlanner-release-${{ steps.metadata.outputs.version }}
          path: dist
          if-no-files-found: error
          retention-days: 30
