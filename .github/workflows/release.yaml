name: SatisPlanner Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing annotated version tag without the v prefix"
        required: true
        default: "0.9.0"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify annotated tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git cat-file -e "v${VERSION}^{tag}"
          test "$(git rev-list -n 1 "v${VERSION}")" = "${GITHUB_SHA}"

      - uses: actions/download-artifact@v8
        with:
          name: SatisPlanner-Windows
          path: artifacts/windows

      - uses: actions/download-artifact@v8
        with:
          name: SatisPlanner-Linux
          path: artifacts/linux

      - uses: actions/download-artifact@v8
        with:
          name: SatisPlanner-macOS
          path: artifacts/macos

      - uses: actions/download-artifact@v8
        with:
          name: SatisPlanner-web
          path: artifacts/web

      - name: Package and checksum smoke artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          zip -j "SatisPlanner-windows-v${VERSION}.zip" artifacts/windows/*
          zip -j "SatisPlanner-linux-v${VERSION}.zip" artifacts/linux/*
          zip -j "SatisPlanner-macos-v${VERSION}.zip" artifacts/macos/*
          (cd artifacts/web && zip -r "../../SatisPlanner-web-v${VERSION}.zip" .)
          sha256sum SatisPlanner-*.zip > SHA256SUMS.txt

      - name: Publish verified development release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" SatisPlanner-*.zip SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --latest \
            --title "SatisPlanner v${VERSION}" \
            --notes "Verified SatisPlanner smoke artifacts from commit ${GITHUB_SHA}. See the slice Delivery Record for acceptance results and known limitations."
