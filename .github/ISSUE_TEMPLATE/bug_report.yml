name: SatisPlanner bug report
description: Report a reproducible SatisPlanner problem without uploading game or personal data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Verify the latest release, read Known Limitations, and redact personal paths. Never attach raw Satisfactory Docs, game artwork, save files, tokens, or secrets.
  - type: input
    id: version
    attributes:
      label: SatisPlanner version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows installer, Windows portable, Linux portable, macOS portable, Web]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest safe sequence and whether the fallback catalog reproduces it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and diagnostics
      description: Attach only redacted SatisPlanner logs or a minimal canonical plan you created.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal paths, raw game data/artwork/save files, credentials and secrets.
          required: true
