[package]
name = "satisplanner"
version = "0.6.0"
description = "SatisPlanner desktop application"
edition = "2024"

[lib]
name = "satisplanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.11.5", features = [] }
